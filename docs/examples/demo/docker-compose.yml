# Démo Pocketdock : trois petits services officiels, disponibles pour linux/arm64.
#   web    : page statique servie par nginx (dossier ./site monté en lecture seule)
#   whoami : renvoie les informations de la requête reçue
#   cache  : redis, avec un healthcheck ; web attend qu'il soit prêt
# Ensuite, sur le téléphone : http://127.0.0.1:8080 et http://127.0.0.1:8081
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  whoami:
    image: traefik/whoami
    ports:
      - "8081:80"
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  cache-data:
