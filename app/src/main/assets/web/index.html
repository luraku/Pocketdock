<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1017">
  <title>Pocketdock</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="brand-logo" aria-hidden="true"><use href="#i-logo"/></svg>
        <span>Pocketdock</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="engine-mini" id="engine-mini"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Vue d'ensemble</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <!-- Hors de #view : #view est redessiné toutes les 2 s ; un champ recréé pendant que le sélecteur
       de fichiers d'Android est ouvert ne recevrait jamais le fichier choisi. -->
  <input type="file" id="compose-file" accept=".gz,.tgz,application/gzip" data-upload hidden>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true">
      <header class="drawer-head">
        <div id="drawer-title"></div>
        <button class="icon-btn" data-close aria-label="Fermer"><svg><use href="#i-x"/></svg></button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 32 32"><rect x="5" y="9" width="6" height="6" rx="1.2" fill="currentColor" opacity=".85"/><rect x="12.5" y="9" width="6" height="6" rx="1.2" fill="currentColor"/><rect x="20" y="9" width="6" height="6" rx="1.2" fill="currentColor" opacity=".85"/><rect x="12.5" y="2" width="6" height="6" rx="1.2" fill="currentColor" opacity=".6"/><path d="M2 17h26c1.6 0 2.4-2.4 4-2.4 0 3.2-2.4 4.8-4 4.8-2.4 5.6-8 8.8-15.2 8.8C6.4 28.2 2.8 24 2 17z" fill="currentColor" opacity=".55"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-pods" viewBox="0 0 24 24"><path d="M12 2l8.5 4.9v9.8L12 21.6l-8.5-4.9V6.9z M12 12l8.5-5 M12 12v9.6 M12 12L3.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-stack" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="9.5" width="16" height="5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="16" width="16" height="5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 5.5h2 M7 12h2 M7 18.5h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5 M3 17.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-disk" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-machine" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8 M12 17v4 M7 9l3 2-3 2 M12 13h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3 M12 18.5v3 M2.5 12h3 M18.5 12h3 M5.3 5.3l2.1 2.1 M16.6 16.6l2.1 2.1 M5.3 18.7l2.1-2.1 M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7 M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13 M10 11v6 M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12 M6 11l6 6 6-6 M5 20h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-term" viewBox="0 0 24 24"><path d="M5 7l5 5-5 5 M12 17h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>
  <script src="app.js"></script>
</body>
</html>
